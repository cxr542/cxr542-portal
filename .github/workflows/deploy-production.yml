name: Deploy Production

on:
  workflow_dispatch:

env:
  VERCEL_CLI_VERSION: 65.2.0

jobs:
  deploy_production:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build app
        run: npm run build

      - name: Deploy production to Vercel
        id: vercel_deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_Vp0kQleFtc5U7n4UQi8U7Ky9
          VERCEL_PROJECT_ID: prj_99WcsURX5Ws8FvWSTDp6uriQK6UQ
        run: |
          npx --yes vercel@"$VERCEL_CLI_VERSION" pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@"$VERCEL_CLI_VERSION" build --prod --token="$VERCEL_TOKEN"
          DEPLOY_OUTPUT="$(npx --yes vercel@"$VERCEL_CLI_VERSION" deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          echo "$DEPLOY_OUTPUT"
          DEPLOY_URL="$(echo "$DEPLOY_OUTPUT" | grep -Eo 'https://[^ ]+\.vercel\.app' | head -n 1)"
          if [ -z "$DEPLOY_URL" ]; then
            echo "Failed to parse production deployment URL."
            exit 1
          fi
          echo "deploy_url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"

      - name: Smoke check root page
        env:
          PRODUCTION_URL: https://cxr542-portal.vercel.app
        run: |
          curl -fsS "$PRODUCTION_URL" > /dev/null
          curl -fsS "$PRODUCTION_URL/?m=release-notes" > /dev/null

      - name: Publish deployment summary
        run: |
          echo "## Production Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch: ${{ github.ref_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: ${{ steps.vercel_deploy.outputs.deploy_url }}" >> "$GITHUB_STEP_SUMMARY"
