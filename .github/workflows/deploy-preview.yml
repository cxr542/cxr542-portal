name: Deploy Preview

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  VERCEL_CLI_VERSION: 65.2.0

jobs:
  deploy_preview:
    runs-on: ubuntu-latest
    if: ${{ github.ref_type == 'branch' && github.ref != 'refs/heads/main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Deploy preview to Vercel
        id: vercel_deploy
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_Vp0kQleFtc5U7n4UQi8U7Ky9
          VERCEL_PROJECT_ID: prj_99WcsURX5Ws8FvWSTDp6uriQK6UQ
        run: |
          : "${GITHUB_REF_NAME:?GitHub branch name is required}"
          npx --yes vercel@"$VERCEL_CLI_VERSION" pull --yes --environment=preview \
            --git-branch "$GITHUB_REF_NAME" --token="$VERCEL_TOKEN"

          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { parseEnv } from 'node:util';

          const { PORTAL_DATA_MODE, VITE_PORTAL_DATA_MODE } = parseEnv(
            readFileSync('.vercel/.env.preview.local', 'utf8'),
          );
          if (PORTAL_DATA_MODE !== 'mock' || (VITE_PORTAL_DATA_MODE !== undefined && VITE_PORTAL_DATA_MODE !== 'mock')) {
            console.error('Preview requires PORTAL_DATA_MODE=mock and a matching VITE_PORTAL_DATA_MODE when set.');
            process.exitCode = 1;
          }
          NODE

          VERCEL_ENV=preview PORTAL_DATA_MODE=mock \
            npx --yes vercel@"$VERCEL_CLI_VERSION" build --environment=preview --token="$VERCEL_TOKEN"
          node scripts/check-mock-bundle.mjs .vercel/output/static
          DEPLOY_OUTPUT="$(npx --yes vercel@"$VERCEL_CLI_VERSION" deploy --prebuilt --environment=preview \
            --env PORTAL_DATA_MODE=mock --meta githubDeployment=1 --meta "githubCommitRef=$GITHUB_REF_NAME" \
            --token="$VERCEL_TOKEN")"
          echo "$DEPLOY_OUTPUT"
          PREVIEW_URL="$(echo "$DEPLOY_OUTPUT" | grep -Eo 'https://[^ ]+\.vercel\.app' | head -n 1)"
          if [ -z "$PREVIEW_URL" ]; then
            echo "Failed to parse preview URL from Vercel output."
            exit 1
          fi
          echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"

      - name: Add preview URL to summary
        env:
          SUMMARY_BRANCH: ${{ github.ref_name }}
        run: |
          echo "## Preview Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch: $SUMMARY_BRANCH" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: ${{ steps.vercel_deploy.outputs.preview_url }}" >> "$GITHUB_STEP_SUMMARY"
